[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pero"
version = "0.1.0"
description = "Photonic Entanglement Research Orchestrator — classical optics analysis + quantum (SPDC/Bell) models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["pero*"]
