[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-agent"
version = "0.1.0"
description = "Per-repository agent factory + sandbox generator for the 420-repo inventory"
requires-python = ">=3.10"
dependencies = ["sovereign-orchestrator>=0.1"]

[tool.setuptools.packages.find]
include = ["repo_agent*"]
