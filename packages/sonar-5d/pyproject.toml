[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-5d"
version = "0.1.0"
description = "5D sonar crystal-mesh geometry: diamond-cubic lattice mesh, OBJ export, time-intensity sweep"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["sonar_5d*"]
