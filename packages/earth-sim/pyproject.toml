[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earth-sim"
version = "0.1.0"
description = "Pangaea Proxima — Earth in 250 million years simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["earth_sim*"]
