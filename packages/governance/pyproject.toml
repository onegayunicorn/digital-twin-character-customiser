[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governance"
version = "0.1.0"
description = "Platform governance agents: Orchestrator, Gatekeeper, Watcher, Tallyman, ChatAgent"
requires-python = ">=3.10"
dependencies = ["sovereign-orchestrator>=0.1"]

[tool.setuptools.packages.find]
include = ["governance*"]
