[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipp-sensor"
version = "0.1.0"
description = "IPS (Invisible Pressure Sensor) nanophotonic detection models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["sensor*"]
