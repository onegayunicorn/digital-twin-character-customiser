[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medgen"
version = "0.1.0"
description = "Medical-genetics simulation: DMD nonsense mutations, repair-mechanism modeling, tumor dynamics. SIMULATED research tooling — no clinical claims."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["medgen*"]
