[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theory-sim"
version = "0.1.0"
description = "DUP (Dimensional Unifying Pressure) / invisible-pressure simulations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["theory_sim*"]
