name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (web-app)
        run: npm run build

      - name: Smoke — simulations
        run: |
          npm run sim:lifestyle
          npm run sim:agent-matrix
          npm run sim:telemetry
          npm run sim:quantum

      - name: Smoke — pipelines
        run: npm run pipeline:telemetry && npm run pipeline:manifest && npm run pipeline:sync
